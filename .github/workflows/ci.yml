name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Lint PHP and JS
        run: npm run check

      - name: Build static export
        run: npm run build

      - name: Verify exported runtime files
        run: |
          test -f out/api.php
          test -f out/.htaccess
          test -f out/404.html
          test -f out/uz/projects/gitinsight/index.html
          test -f out/admin/index.html
          test -f out/admin/verify/index.html
          test -f out/admin/dashboard/index.html

      - name: Verify no secrets in the build artifact
        run: |
          test ! -e out/config.local.php
          test ! -e out/config.local.js
          test ! -e out/github_keys.txt
