<script>
  (function () {
    var supported = ['uz', 'ru', 'en'];
    var detected = (navigator.languages || [navigator.language || '']).map(function (lang) {
      return (lang || '').toLowerCase().substring(0, 2);
    });
    var match = supported.find(function (lang) {
      return detected.includes(lang);
    });
    window.location.href = '/' + (match || 'uz');
  })();
</script>
